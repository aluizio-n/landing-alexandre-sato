# Config do nginx DO HOST (VPS), nao do container.
#   cp deploy/alexandresato.com.br.conf /etc/nginx/sites-available/alexandresato.com.br
#   ln -s /etc/nginx/sites-available/alexandresato.com.br /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d alexandresato.com.br -d www.alexandresato.com.br
# O certbot adiciona os blocos de SSL e o redirect 80 -> 443 automaticamente.
server {
    listen 80;
    listen [::]:80;
    server_name alexandresato.com.br www.alexandresato.com.br;

    location / {
        # O compose publica o container em 127.0.0.1:8082.
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
